<meta charset="utf-8">
<title>Darren Sims Projects</title>
<link rel="icon" type="image/png" href="/logo.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ---------- Tokens ---------- */
  :root {
    --ground: #f5f5f5;
    --surface: #ffffff;
    --surface-sunken: #ebebeb;
    --surface-raised-shadow: 0 1px 2px rgba(10,10,10,0.06), 0 1px 1px rgba(10,10,10,0.04);
    --border: #d4d4d4;
    --border-interactive: #737373;
    --text-primary: #111111;
    --text-secondary: #404040;
    --text-on-accent: #ffffff;

    --accent: #1e2a5e;
    --accent-strong: #141b45;
    --accent-tint: #e8edfa;
    --accent-tint-2: #c6d3f4;
    --accent-ring: #aebdec;

    --success-text: #157a4a;
    --success-bg: #e3f5eb;
    --warning-text: #92400e;
    --warning-bg: #fef3e0;
    --danger-text: #b91c1c;
    --danger-bg: #fdeaea;
    --danger-solid: #b91c1c;
    --neutral-text: #1a1a1a;
    --neutral-bg: #e5e5e5;

    --font-display: "Archivo", "Arial Black", sans-serif;
    --font-body: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --radius-sm: 5px;
    --radius-md: 8px;
    --radius-lg: 14px;
    --radius-pill: 999px;

    --nav-w: 232px;
    --hero-wash: radial-gradient(120% 160% at 8% -10%, #eef1fb 0%, #f6f4ee 38%, #eef7f5 68%, #f7f7f5 100%);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0a0a0a;
      --surface: #171717;
      --surface-sunken: #101010;
      --surface-raised-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 4px 14px rgba(0,0,0,0.35);
      --border: #262626;
      --border-interactive: #666666;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-on-accent: #ffffff;

      --accent: #6f8fe0;
      --accent-strong: #a9bcee;
      --accent-tint: #14203f;
      --accent-tint-2: #1b2a52;
      --accent-ring: #3a4a86;

      --success-text: #7fe0b3;
      --success-bg: #10261c;
      --warning-text: #f5c576;
      --warning-bg: #2a1d0a;
      --danger-text: #f3a6a6;
      --danger-bg: #2a0f0f;
      --danger-solid: #991b1b;
      --neutral-text: #d4d4d4;
      --neutral-bg: #1e1e1e;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0a0a0a;
    --surface: #171717;
    --surface-sunken: #101010;
    --surface-raised-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 4px 14px rgba(0,0,0,0.35);
    --border: #262626;
    --border-interactive: #666666;
    --text-primary: #f5f5f5;
    --text-secondary: #a3a3a3;
    --text-on-accent: #ffffff;

    --accent: #6f8fe0;
    --accent-strong: #a9bcee;
    --accent-tint: #14203f;
    --accent-tint-2: #1b2a52;
    --accent-ring: #3a4a86;

    --success-text: #7fe0b3;
    --success-bg: #10261c;
    --warning-text: #f5c576;
    --warning-bg: #2a1d0a;
    --danger-text: #f3a6a6;
    --danger-bg: #2a0f0f;
    --danger-solid: #991b1b;
    --neutral-text: #d4d4d4;
    --neutral-bg: #1e1e1e;
  }

  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--hero-wash, var(--ground));
    background-color: var(--ground);
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: var(--ground); }
  }
  :root[data-theme="dark"] body { background: var(--ground); }
  h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }
  input, textarea, select, button { font-family: var(--font-body); }
  ::selection { background: var(--accent-tint-2); }

  *:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .tabular { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

  /* ---------- App shell ---------- */
  #app { display: flex; min-height: 100vh; }

  .rail {
    width: var(--nav-w);
    flex: 0 0 var(--nav-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 8px;
  }
  .brand-mark {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    flex: none;
  }
  .brand-mark img, .brand-mark picture { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.15; }
  .brand-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); padding: 6px 10px 4px; }
  .nav-link {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    text-decoration: none;
    color: var(--text-primary);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-link:hover { background: var(--surface-sunken); }
  .nav-link[aria-current="page"] { background: var(--accent-tint); color: var(--accent-strong); font-weight: 600; }
  .nav-link .ico { width: 17px; display: inline-flex; align-items: center; justify-content: center; flex: none; opacity: 0.8; }
  .nav-link .ico svg { display: block; }

  .rail-foot { margin-top: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .save-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-secondary);
    padding: 5px 9px; border-radius: 999px; background: var(--surface-sunken);
    border: 1px solid var(--border);
  }
  .backup-link {
    font-size: 12px; color: var(--text-secondary); background: none; border: none;
    cursor: pointer; padding: 3px 9px; text-decoration: underline; text-underline-offset: 2px;
  }
  .backup-link:hover { color: var(--accent); }
  .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); flex: none; }
  .save-pill[data-state="saved"] .save-dot { background: var(--success-text); }
  .save-pill[data-state="saving"] .save-dot { background: var(--warning-text); }
  .save-pill[data-state="error"] .save-dot,
  .save-pill[data-state="readonly"] .save-dot,
  .save-pill[data-state="load_error"] .save-dot { background: var(--danger-text); }

  .main {
    flex: 1 1 auto;
    min-width: 0;
    padding: 34px 40px 80px;
    max-width: 1180px;
  }
  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; margin-bottom: 26px; flex-wrap: wrap;
  }
  .page-head h1 { font-size: 26px; }
  .page-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .page-sub { color: var(--text-secondary); font-size: 14.5px; margin-top: 6px; max-width: 60ch; }

  /* ---------- Buttons & inputs ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 9px 17px; border-radius: var(--radius-pill);
    font-size: 13.5px; font-weight: 600; cursor: pointer;
    border: 1.5px solid var(--accent);
    background: var(--surface); color: var(--accent);
    line-height: 1.2;
    transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { background: var(--accent-tint); }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: var(--text-on-accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-quiet { border-color: transparent; background: none; color: var(--text-primary); }
  .btn-quiet:hover { background: var(--surface-sunken); }
  .btn-danger-quiet { border-color: transparent; background: none; color: var(--danger-text); }
  .btn-danger-quiet:hover { background: var(--danger-bg); }
  .btn-danger { background: var(--danger-solid); border-color: var(--danger-solid); color: #ffffff; }
  .btn-danger:hover { filter: brightness(0.9); }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .icon-btn { padding: 6px 8px; border-radius: var(--radius-md); border: 1px solid transparent; background: none; cursor: pointer; color: var(--text-secondary); }
  .icon-btn:hover { background: var(--accent-tint); color: var(--accent); }

  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
  .field { margin-bottom: 14px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > .field { flex: 1; }
  input[type="text"], input[type="number"], input[type="date"], input[type="url"], textarea, select {
    width: 100%;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-interactive);
    background: var(--surface);
    color: var(--text-primary);
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 76px; }
  .hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .color-field-row { display: flex; gap: 8px; align-items: center; }
  .color-field-row input[type="color"] {
    width: 40px; height: 38px; padding: 3px; flex: none; cursor: pointer;
    border: 1px solid var(--border-interactive); border-radius: var(--radius-sm); background: var(--surface);
  }
  .color-field-row input[type="text"] { flex: 1; font-family: var(--font-mono); }

  .client-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--border); flex: none; }
  .client-link { color: inherit; text-decoration: none; }
  .client-link:hover { color: var(--accent); text-decoration: underline; }

  /* ---------- Cards / lists ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--surface-raised-shadow);
  }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-tile { padding: 16px 18px; }
  .stat-num { font-family: var(--font-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 12px; }
  .section-head h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em; }
  .section-head .see-all { font-size: 13px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 600; }

  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .project-card { padding: 16px 17px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
  .project-card:hover { border-color: var(--border-interactive); }
  .project-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .project-card h3 { font-size: 15.5px; }
  .project-client { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .project-meta-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
  .progress-track { height: 5px; border-radius: 3px; background: var(--surface-sunken); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .pill-success { background: var(--success-bg); color: var(--success-text); }
  .pill-warning { background: var(--warning-bg); color: var(--warning-text); }
  .pill-danger { background: var(--danger-bg); color: var(--danger-text); }
  .pill-neutral { background: var(--neutral-bg); color: var(--neutral-text); }
  .pill-accent { background: var(--accent-tint); color: var(--accent-strong); }
  .pill-explore { background: none; border: 1px dashed var(--border-interactive); color: var(--text-secondary); padding: 2px 8px; }
  .pill-dropped { background: var(--surface-sunken); color: var(--text-secondary); text-decoration: line-through; }

  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 4px; border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row-main { flex: 1; min-width: 0; }
  .list-row-title { font-size: 14px; font-weight: 600; }
  .list-row-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; }

  .empty-state {
    text-align: left; padding: 34px 30px; border: 1px dashed var(--border-interactive);
    border-radius: var(--radius-lg); background: var(--surface);
  }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; }
  .empty-state p { color: var(--text-secondary); font-size: 13.5px; max-width: 48ch; margin-bottom: 14px; }

  /* ---------- Project detail / board ---------- */
  .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
  .back-link { font-size: 12.5px; color: var(--text-secondary); background: none; border: none; cursor: pointer; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .back-link:hover { color: var(--text-primary); }
  .detail-tags { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .detail-desc { color: var(--text-secondary); font-size: 14px; max-width: 68ch; margin-top: 12px; }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; align-items: start; }
  .board-col { background: var(--surface-sunken); border-radius: var(--radius-lg); padding: 12px; min-height: 60px; }
  .board-col-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
  .board-col-head h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
  .board-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-secondary); }
  .task-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 10px 11px; margin-bottom: 8px; font-size: 13.5px; cursor: pointer;
  }
  .task-card:hover { border-color: var(--border-interactive); }
  .task-card:last-child { margin-bottom: 0; }
  .task-card-title {
    display: block; width: 100%; text-align: left;
    font-weight: 500; line-height: 1.35; font-size: inherit; color: inherit;
    background: none; border: none; padding: 0; margin: 0; cursor: pointer;
  }
  .task-card-title:hover { color: var(--accent); }
  .task-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .task-due { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
  .task-due.overdue { color: var(--danger-text); font-weight: 600; }
  .task-add-row { padding: 4px; }
  .task-add-input {
    width: 100%; border: 1px dashed var(--border-interactive); background: none;
    border-radius: var(--radius-md); padding: 8px 9px; font-size: 13px; color: var(--text-primary);
  }
  .task-add-input::placeholder { color: var(--text-secondary); }

  .note-type-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .note-log { margin-top: 8px; }
  .note-item { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
  .note-item:last-child { border-bottom: none; }
  .note-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
  .note-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .note-text { font-size: 13.5px; white-space: pre-wrap; }
  .note-time { font-size: 11.5px; color: var(--text-secondary); font-family: var(--font-mono); margin-top: 3px; }

  /* ---------- Proposals ---------- */
  .split { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .proposal-preview, .contract-preview {
    padding: 32px 36px; font-size: 14px; line-height: 1.65;
  }
  .proposal-preview h2, .contract-preview h2 { font-size: 20px; margin-bottom: 4px; }
  .proposal-preview .p-meta, .contract-preview .p-meta { color: var(--text-secondary); font-size: 12.5px; margin-bottom: 22px; }
  .proposal-preview h3, .contract-preview h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin: 22px 0 8px; }
  .proposal-preview h3:first-of-type, .contract-preview h3:first-of-type { margin-top: 0; }
  .proposal-preview p, .contract-preview p { margin-bottom: 10px; white-space: pre-wrap; }
  .proposal-preview ul, .contract-preview ul { list-style: disc; padding-left: 20px; margin-bottom: 10px; }
  .proposal-preview li, .contract-preview li { margin-bottom: 4px; }
  .form-section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); display: block; margin: 18px 0 8px; }
  .form-section-label:first-child { margin-top: 0; }
  .deliverable-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .deliverable-row input { flex: 1; }
  .dyn-add { font-size: 12.5px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 600; padding: 4px 0; }

  .proposal-list-row { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .proposal-list-row:hover .list-row-title { color: var(--accent); }
  .proposal-list-row:last-child { border-bottom: none; }

  /* ---------- Marketing ---------- */
  .suggestion-card { padding: 18px 20px; margin-bottom: 14px; }
  .suggestion-context { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
  .angle-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .angle-tab {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-secondary);
  }
  .angle-tab[aria-pressed="true"] { background: var(--accent-tint); border-color: var(--accent-tint-2); color: var(--accent-strong); }
  .draft-text {
    width: 100%; min-height: 130px; border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 12px 13px; font-size: 13.5px; line-height: 1.55; background: var(--surface-sunken); color: var(--text-primary);
  }
  .suggestion-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; flex-wrap: wrap; }
  .char-count { font-size: 11.5px; color: var(--text-secondary); font-family: var(--font-mono); }
  .detail-toggle { font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 600; margin-bottom: 10px; }

  .tab-strip { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab-strip button { padding: 9px 4px; margin-right: 18px; background: none; border: none; border-bottom: 2px solid transparent; font-size: 13.5px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
  .tab-strip button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); }

  /* ---------- Dialog ---------- */
  dialog {
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 0; width: min(520px, 92vw); color: var(--text-primary); background: var(--surface);

<div id="app"></div>
<div class="toast-region" id="toastRegion" aria-live="polite"></div>
<div class="sr-only" role="status" aria-live="polite" id="statusAnnouncer"></div>

<script>
(function () {
  "use strict";

  /* ====================== DATA MODEL ====================== */

  function uid(prefix) {
    return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function defaultState() {
    return {
      version: 1,
      clients: [],
      projects: [],
      tasks: [],
      proposals: [],
      contracts: [],
      marketingDrafts: [],
      route: "#/overview"
    };
  }

  var state = defaultState();
  var saveState = "idle"; // idle | saving | saved | dirty | error | readonly | load_error
  var saveErrorMsg = "";
  var saveTimer = null;
  var hasLoadedRemote = false;
  var loadFailed = false;

  /* ====================== PERSISTENCE ====================== */
  /* Talks to this app's own server (server.js) — GET/PUT /api/state, backed
     by Postgres. A 401 means the login cookie is missing or expired, which
     the server only issues once the password is entered — redirect there
     rather than showing a scary save error.

     loadData() retries on failure rather than giving up immediately, since a
     free-tier host can take a while to wake from a cold start. Until it
     succeeds at least once, hasLoadedRemote stays false and scheduleSave()
     refuses to run — otherwise a failed load would leave `state` at its
     empty defaults, and any edit made in that window would autosave and
     overwrite whatever was already saved on the server with nothing. */

  function loadData(attempt) {
    attempt = attempt || 1;
    return fetch("/api/state", { cache: "no-store" })
      .then(function (res) {
        if (res.status === 401) { window.location.href = "/login"; throw new Error("unauthorized"); }
        if (!res.ok) throw new Error("load-failed");
        return res.json();
      })
      .then(function (data) {
        state = Object.assign(defaultState(), data);
        hasLoadedRemote = true;
        loadFailed = false;
      })
      .catch(function (err) {
        if (err && err.message === "unauthorized") return;
        if (attempt < 6) {
          return new Promise(function (resolve) { setTimeout(resolve, attempt * 3000); })
            .then(function () { return loadData(attempt + 1); });
        }
        loadFailed = true;
      });
  }

  function scheduleSave() {
    if (!hasLoadedRemote) return; // never autosave over data we haven't actually loaded yet
    setSaveState("dirty");
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(persistNow, 1200);
  }

  /**
   * Saves go through here one at a time, so a normal edit's autosave and
   * (previously) an attachment save couldn't race each other into a
   * needless conflict. Attachments are link-only now and just piggyback on
   * the regular state save, but keeping saves serialized is still good
   * hygiene if a future feature adds a second save path.
   */
  var publishChain = Promise.resolve();
  function queuePublish(payload) {
    var call = publishChain.then(function () {
      return fetch("/api/state", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: payload
      }).then(function (res) {
        if (res.status === 401) {
          var authErr = new Error("Session expired — please log in again");
          authErr.code = "not_granted";
          throw authErr;
        }
        if (!res.ok) {
          var err = new Error("Server returned " + res.status);
          err.code = "upstream_error";
          throw err;
        }
        return res.json().catch(function () { return {}; });
      });
    });
    publishChain = call.catch(function () {}); // keep the chain alive even if this call fails
    return call;
  }

  function persistNow() {
    setSaveState("saving");
    var payload = JSON.stringify(state);
    queuePublish(payload)
      .then(function () {
        setSaveState("saved");
      })
      .catch(function (err) {
        var code = err && err.code;
        if (code === "not_granted") {
          setSaveState("readonly");
          setTimeout(function () { window.location.href = "/login"; }, 1200);
        } else {
          saveErrorMsg = (err && err.message) || "Could not save";
          setSaveState("error");
        }
      });
  }

  function setSaveState(s) {
    saveState = s;
    renderSavePill();
  }

  /* ====================== HELPERS ====================== */

  var STATUS_META = {
    working_it_out: { label: "Working it out", cls: "pill-explore" },
    not_started: { label: "Not started", cls: "pill-neutral" },
    active: { label: "Active", cls: "pill-accent" },
    on_hold: { label: "On hold", cls: "pill-warning" },
    complete: { label: "Complete", cls: "pill-success" },
    dropped: { label: "Dropped", cls: "pill-dropped" }
  };
  var TASK_COLS = [
    { key: "todo", label: "To do" },
    { key: "doing", label: "Doing" },
    { key: "done", label: "Done" }
  ];

  function esc(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var HEX_RE = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
  function isValidHex(str) { return !!str && HEX_RE.test(str.trim()); }
  function normalizeHex(str) {
    var h = str.trim();
    if (h.length === 4) { h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3]; }
    return h.toLowerCase();
  }
  function hostFromUrl(url) {
    if (!url) return "";
    try { return new URL(/^https?:\/\//i.test(url) ? url : "https://" + url).hostname.replace(/^www\./, ""); }
    catch (e) { return url; }
  }
  function websiteHref(url) {
    if (!url) return "";
    return /^https?:\/\//i.test(url) ? url : "https://" + url;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function fmtDateShort(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }

  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ", " +
      d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function isOverdue(iso) {
    if (!iso) return false;
    return iso < todayISO();
  }

  function clientById(id) { return state.clients.find(function (c) { return c.id === id; }); }
  function projectById(id) { return state.projects.find(function (p) { return p.id === id; }); }
  function tasksForProject(id) { return state.tasks.filter(function (t) { return t.projectId === id; }); }

  /* Resolves the client connected to a proposal/contract via its linked
   * project, and its brand colour if one is set — used to give a document
   * a subtle accent matching the client it's for, without ever requiring
   * one (both fall back to nothing when there's no link or no colour). */
  function clientForLinkedEntity(entity) {
    if (!entity || !entity.projectId) return null;
    var proj = projectById(entity.projectId);
    return proj ? clientById(proj.clientId) : null;
  }
  function brandAccentFor(entity) {
    var client = clientForLinkedEntity(entity);
    return client && isValidHex(client.brandColor) ? client.brandColor : "";
  }

  function projectProgress(id) {
    var tasks = tasksForProject(id);
    if (!tasks.length) return 0;
    var done = tasks.filter(function (t) { return t.status === "done"; }).length;
    return Math.round((done / tasks.length) * 100);
  }

  function money(n) {
    var v = Number(n);
    if (isNaN(v)) return "";
    return "£" + v.toLocaleString("en-GB", { maximumFractionDigits: 0 });
  }

  function showToast(msg) {
    var region = document.getElementById("toastRegion");
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    region.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  function mutate(fn) {
    fn();
    scheduleSave();
    render();
  }

  /* ====================== ROUTER ====================== */

  window.addEventListener("hashchange", render);

  function currentRoute() {
    var h = location.hash || "#/overview";
    var parts = h.replace(/^#\//, "").split("/");
    return { name: parts[0] || "overview", id: parts[1] || null, sub: parts[2] || null };
  }

  function navigate(hash) { location.hash = hash; }

  /* ====================== RENDER: SHELL ====================== */

  function render() {
    var app = document.getElementById("app");
    var r = currentRoute();
    var view = "";
    if (r.name === "overview") view = viewOverview();
    else if (r.name === "projects" && r.id) view = viewProjectDetail(r.id);
    else if (r.name === "projects") view = viewProjects();
    else if (r.name === "clients") view = viewClients();
    else if (r.name === "proposals" && r.id) view = viewProposalEditor(r.id);
    else if (r.name === "proposals") view = viewProposals();
    else if (r.name === "contracts" && r.id) view = viewContractEditor(r.id);
    else if (r.name === "contracts") view = viewContracts();
    else if (r.name === "marketing") view = viewMarketing();
    else view = viewOverview();

    app.innerHTML = railHTML(r) + '<main class="main" id="main">' + view + "</main>";
    renderSavePill();
    wireGlobalEvents();
  }

  var NAV_ICONS = {
    overview: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="6" height="6" rx="1"/><rect x="8.5" y="1.5" width="6" height="4" rx="1"/><rect x="8.5" y="7.5" width="6" height="7" rx="1"/><rect x="1.5" y="9.5" width="6" height="5" rx="1"/></svg>',
    projects: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 4.2c0-.9.7-1.6 1.6-1.6h3l1.4 1.6h5.4c.9 0 1.6.7 1.6 1.6v6.6c0 .9-.7 1.6-1.6 1.6H3.1c-.9 0-1.6-.7-1.6-1.6V4.2z"/></svg>',
    clients: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5.2" r="2.7"/><path d="M2.3 14c.6-3 2.8-4.7 5.7-4.7s5.1 1.7 5.7 4.7"/></svg>',
    proposals: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 1.8h6l3 3v8.4c0 .55-.45 1-1 1h-8c-.55 0-1-.45-1-1v-10.4c0-.55.45-1 1-1z"/><path d="M9.2 1.8v3.2h3.1"/><path d="M5.3 8.4h5.4M5.3 10.7h5.4M5.3 6.1h2.3"/></svg>',
    contracts: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 1.8h6l3 3v8.4c0 .55-.45 1-1 1h-8c-.55 0-1-.45-1-1v-10.4c0-.55.45-1 1-1z"/><path d="M9.2 1.8v3.2h3.1"/><path d="M5.3 11.3c1-1.5 1.8-1.5 2.5-.5.7 1 1.5 1 2.5-.5"/></svg>',
    marketing: '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.8 6.3v3.4c0 .5.4.9.9.9h1.1l3.6 2.8V2.6L3.8 5.4H2.7c-.5 0-.9.4-.9.9z"/><path d="M10.4 5.1c.9.7 1.4 1.8 1.4 2.9s-.5 2.2-1.4 2.9M12.7 3.1c1.5 1.2 2.4 3 2.4 4.9s-.9 3.7-2.4 4.9"/></svg>'
  };

  function railHTML(r) {
    function link(route, label) {
      var active = r.name === route;
      return '<button class="nav-link" data-nav="#/' + route + '" aria-current="' + (active ? "page" : "false") + '">' +
        '<span class="ico" aria-hidden="true">' + NAV_ICONS[route] + "</span>" + esc(label) + "</button>";
    }
    return '' +
      '<nav class="rail" aria-label="Primary">' +
      '<div class="brand"><div class="brand-mark" aria-hidden="true"><picture><source srcset="/logo-dark.png" media="(prefers-color-scheme: dark)"><img src="/logo.png" alt=""></picture></div><div>' +
      '<div class="brand-name">Darren Sims Projects</div><div class="brand-sub">Studio ops</div>' +
      "</div></div>" +
      '<div class="nav-group">' +
      link("overview", "Overview") +
      link("clients", "Clients") +
      link("projects", "Projects") +
      link("proposals", "Proposals") +
      link("contracts", "Contracts") +
      link("marketing", "Marketing") +
      "</div>" +
      '<div class="rail-foot"><span class="save-pill" id="savePill" data-state="idle"><span class="save-dot"></span><span id="savePillText">—</span></span>' +
      '<button type="button" class="backup-link" data-open-modal="backup">Backup data</button>' +
      '<button type="button" class="backup-link" data-logout="1">Log out</button></div>' +
      "</nav>";
  }

  function renderSavePill() {
    var pill = document.getElementById("savePill");
    var text = document.getElementById("savePillText");
    if (!pill || !text) return;
    var map = {
      idle: "Loading…",
      saved: "All changes saved",
      saving: "Saving…",
      dirty: "Unsaved changes",
      error: "Couldn't save — " + saveErrorMsg,
      readonly: "Session expired — redirecting to login…",
      load_error: "Couldn't load your data — refresh to retry. Nothing will save until it loads."
    };
    pill.setAttribute("data-state", saveState);
    text.textContent = map[saveState] || "—";
    if (saveState === "saved" || saveState === "error" || saveState === "readonly") {
      var announcer = document.getElementById("statusAnnouncer");
      if (announcer) announcer.textContent = map[saveState];
    }
  }

  function wireGlobalEvents() {
    document.querySelectorAll("[data-nav]").forEach(function (el) {
      el.addEventListener("click", function () { navigate(el.getAttribute("data-nav")); });
    });
  }

  /* ====================== VIEW: OVERVIEW ====================== */

  function viewOverview() {
    var activeProjects = state.projects.filter(function (p) { return p.status === "active"; });
    var exploringProjects = state.projects.filter(function (p) { return p.status === "working_it_out"; });
    var openTasks = state.tasks.filter(function (t) { return t.status !== "done"; });
    var overdueTasks = openTasks.filter(function (t) { return isOverdue(t.dueDate); });
    var dueSoon = openTasks
      .filter(function (t) { return t.dueDate; })
      .sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : 1; })
      .slice(0, 6);

    if (!state.clients.length) {
      return pageHead("Overview", "A running view of every project, so nothing depends on memory.") +
        emptyState(
          "Start with a client",
          "Add your first client, then create a project for them. Tasks, a proposal and marketing drafts all hang off a project once it exists.",
          '<button class="btn btn-primary" data-open-modal="client">Add a client</button>'
        );
    }

    if (!state.projects.length) {
      return pageHead("Overview", "A running view of every project, so nothing depends on memory.") +
        emptyState(
          "Add your first project",
          "You've got a client — now add a project for them. If it's still early days, use “Working it out” as the status until it's confirmed.",
          '<button class="btn btn-primary" data-open-modal="project">Add a project</button>'
        );
    }

    var html = pageHead("Overview", "A running view of every project, so nothing depends on memory.");

    html += '<div class="stat-row">' +
      statTile(state.projects.length, "Projects") +
      statTile(activeProjects.length, "Active") +
      statTile(openTasks.length, "Open tasks") +
      statTile(overdueTasks.length, "Overdue", overdueTasks.length ? "danger" : null) +
      "</div>";

    html += '<div class="section-head"><h2>Due soon</h2></div>';
    if (!dueSoon.length) {
      html += '<p class="page-sub">Nothing with a due date on the board right now.</p>';
    } else {
      html += '<div class="card">' + dueSoon.map(function (t) {
        var p = projectById(t.projectId);
        return '<div class="list-row">' +
          '<div class="list-row-main"><div class="list-row-title">' + esc(t.title) + '</div>' +
          '<div class="list-row-sub">' + esc(p ? p.name : "") + '</div></div>' +
          '<span class="tabular task-due' + (isOverdue(t.dueDate) ? " overdue" : "") + '">' + fmtDateShort(t.dueDate) + '</span>' +
          '</div>';
      }).join("") + "</div>";
    }

    if (exploringProjects.length) {
      html += '<div class="section-head"><h2>Working it out</h2></div>';
      html += '<div class="project-grid">' + exploringProjects.slice(0, 6).map(projectCardHTML).join("") + "</div>";
    }

    html += '<div class="section-head"><h2>Active projects</h2><button class="see-all" data-nav="#/projects">All projects &rarr;</button></div>';
    html += '<div class="project-grid">' + activeProjects.slice(0, 6).map(projectCardHTML).join("") + "</div>";
    if (!activeProjects.length) html += winWorkPanelHTML();

    return html;
  }

  function statTile(num, label, tone) {
    return '<div class="card stat-tile"><div class="stat-num"' + (tone === "danger" && num ? ' style="color:var(--danger-text)"' : "") + '>' + num + '</div><div class="stat-label">' + esc(label) + "</div></div>";
  }

  /* ---- Win new work (shown on Overview when there are no active projects) ---- */

  var WIN_WORK_ANGLES = [
    { key: "capacity", label: "Capacity" },
    { key: "case_study", label: "Recent work" },
    { key: "process", label: "Your process" },
    { key: "referral", label: "Referrals" }
  ];

  var winWorkState = { activeIdea: "capacity", ideaText: {} };

  function prospectingText(angle) {
    var recentDone = state.projects
      .filter(function (p) { return p.status === "complete"; })
      .sort(function (a, b) { return (b.updatedAt || "").localeCompare(a.updatedAt || ""); })[0];

    var banks = {
      capacity: [
        "I've got space for one more project this month. If your site's overdue for a rebuild or a refresh, get in touch.\nNo pressure — just flagging the slot exists.",
        "A slot's opened up in my schedule. If you've been putting off sorting your website, now's a good time to ask.",
        "Taking on one new project this month. Builds, redesigns and ongoing support are all fair game."
      ],
      case_study: recentDone
        ? [
            "Recently wrapped up " + recentDone.name + ".\nAlways a good feeling closing out a project a client's happy with. Happy to walk anyone through how it came together.",
            "Case study time: " + recentDone.name + ", now live.\nIf you're weighing up something similar, I can talk through what that project involved.",
            "One from the archive: " + recentDone.name + ".\nA good example of what a project with me tends to look like, start to finish."
          ]
        : [
            "Putting together a case study from a recent project — worth sharing once it's written up.",
            "Been meaning to walk through how a recent build went, start to finish. Coming soon.",
            "A look back at a recent project is on the list to write up properly."
          ],
      process: [
        "A question I get a lot: what does working with a freelance web developer actually look like?\nShort version — a call, a proposal, then regular check-ins until launch.",
        "No jargon, no surprise invoices. Here's roughly how a project with me runs, start to finish.",
        "How I explain my process to new clients comes down to three things: clarity, small steps, and no disappearing acts."
      ],
      referral: [
        "If you know someone whose website needs sorting, send them my way. Always happy to have a no-pressure chat first.",
        "Referrals are how most of my work finds me. If that's you, thank you — and if you know someone who needs a hand, I'm around.",
        "Quick ask: if a friend or colleague has mentioned needing a new site, point them at me."
      ]
    };
    var options = banks[angle] || banks.capacity;
    var idx = Math.floor(Math.random() * options.length);
    return options[idx].trim();
  }

  function pastClients() {
    var liveStatuses = { active: 1, working_it_out: 1, not_started: 1, on_hold: 1 };
    return state.clients.filter(function (c) {
      var projs = state.projects.filter(function (p) { return p.clientId === c.id; });
      if (!projs.length) return false;
      var hasLive = projs.some(function (p) { return liveStatuses[p.status]; });
      var hasPast = projs.some(function (p) { return p.status === "complete" || p.status === "dropped"; });
      return hasPast && !hasLive;
    });
  }

  function checkinEmailText(client) {
    var pastProjects = state.projects
      .filter(function (p) { return p.clientId === client.id && (p.status === "complete" || p.status === "dropped"); })
      .sort(function (a, b) { return (b.updatedAt || "").localeCompare(a.updatedAt || ""); });
    var lastProj = pastProjects[0];
    var firstName = (client.name || "").split(" ")[0] || client.name;
    var projectBit = lastProj ? ("since we finished " + lastProj.name) : "since we last worked together";
    return "Hi " + firstName + ",\n\n" +
      "It's been a while " + projectBit + " — hope it's holding up well.\n\n" +
      "Wanted to check in and see if there's anything on your side that needs attention: updates, new pages, a refresh, or anything else. Happy to take a look either way.\n\n" +
      "No pressure if now's not the time.";
  }

  function winWorkPanelHTML() {
    var activeKey = winWorkState.activeIdea || "capacity";
    if (!winWorkState.ideaText[activeKey]) winWorkState.ideaText[activeKey] = prospectingText(activeKey);
    var ideaText = winWorkState.ideaText[activeKey];
    var pc = pastClients().slice(0, 4);

    var html = '<div class="card" style="padding:16px 18px;">' +
      '<p class="hint" style="margin-bottom:14px;">No active projects right now. A couple of ways to change that — post something, or check in with someone you\'ve worked with before.</p>';

  /* ---- Attachments (links + uploaded files) ----
   * Two kinds of attachment, shown together in one list: a link out to a
   * file that already lives elsewhere (Drive, Dropbox, an email), or a file
   * uploaded straight into Fieldnotes (up to 10MB). Links are just text, so
   * they save through the same mutate()/autosave path as everything else in
   * the app. Uploaded files are NOT part of that JSON blob — they live in
   * their own database table and go through their own upload/download/
   * delete endpoints, fetched per-project on demand (see loadFileAttachments
   * below). Putting file bytes in the autosaved blob would mean re-sending
   * every attached file on every unrelated edit, since that blob is
   * rewritten in full on each save. */

  var fileAttachmentsCache = {}; // projectId -> array once loaded, null while loading, undefined before first request

  function loadFileAttachments(projectId) {
    if (fileAttachmentsCache[projectId] !== undefined) return;
    fileAttachmentsCache[projectId] = null;
    fetch("/api/attachments?projectId=" + encodeURIComponent(projectId), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("load-failed");
        return res.json();
      })
      .then(function (list) {
        fileAttachmentsCache[projectId] = list;
        render();
      })
      .catch(function () {
        fileAttachmentsCache[projectId] = []; // fail quiet rather than block the page — worst case the list looks empty until the project is reopened
      });
  }

  function formatFileSize(bytes) {
    if (bytes == null) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function attachmentsSectionHTML(p) {
    var links = (p.attachments || []).map(function (a) {
      return { kind: "link", id: a.id, label: a.label || hostFromUrl(a.url), sub: hostFromUrl(a.url), date: a.addedAt, href: websiteHref(a.url) };
    });
    var cached = fileAttachmentsCache[p.id];
    var loadingFiles = cached == null;
    var files = (cached || []).map(function (a) {
      return { kind: "file", id: a.id, label: a.label || a.filename, sub: formatFileSize(a.sizeBytes), date: a.createdAt, href: "/api/attachments/" + a.id + "/download" };
    });
    var items = links.concat(files).sort(function (x, y) { return new Date(y.date) - new Date(x.date); });

    var html = '<div class="card" style="padding:16px 18px;">' +
      '<p class="hint" style="margin-bottom:14px;">Link out to files that live elsewhere (Drive, Dropbox, your inbox), or upload one directly (up to 10MB).</p>' +
      '<div class="field" style="margin-bottom:8px;"><label for="attLabelInput">What is it</label>' +
      '<input type="text" id="attLabelInput" placeholder="e.g. Signed proposal, March 2025"></div>' +
      '<div class="field" style="margin-bottom:10px;"><label for="attUrlInput">Link</label>' +
      '<input type="text" id="attUrlInput" placeholder="Paste a link"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:2px;">' +
      '<button type="button" class="btn btn-sm" data-add-attachment="' + p.id + '">Add link</button>' +
      '<span class="hint">or</span>' +
      '<input type="file" id="attFileInput" style="max-width:220px;">' +
      '<button type="button" class="btn btn-sm" data-upload-attachment="' + p.id + '">Upload file</button>' +
      "</div>";

    if (items.length) {
      html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-subtle);">' + items.map(function (a) {
        var kindTag = a.kind === "file" ? '<span class="pill pill-neutral" style="margin-right:6px;">Uploaded</span>' : "";
        var delAttr = a.kind === "file"
          ? 'data-delete-file-attachment="' + a.id + '"'
          : 'data-delete-attachment="' + a.id + '" data-attachment-project="' + p.id + '"';
        return '<div class="list-row" style="padding:8px 0;">' +
          '<div class="list-row-main"><div class="list-row-title">' + kindTag +
          '<a href="' + esc(a.href) + '" target="_blank" rel="noopener noreferrer">' + esc(a.label) + "</a></div>" +
          '<div class="list-row-sub">' + esc(a.sub) + " &middot; added " + fmtDateShort(String(a.date).slice(0, 10)) + "</div></div>" +
          '<button type="button" class="icon-btn" ' + delAttr + ' title="Remove">Remove</button>' +
          "</div>";
      }).join("") + "</div>";
    } else if (loadingFiles) {
      html += '<p class="hint" style="margin-top:14px;">Loading…</p>';
    } else {
      html += '<p class="hint" style="margin-top:14px;">No links or files added yet.</p>';
    }
    html += "</div>";
    return html;
  }

  function taskCardHTML(t) {
    return '<div class="task-card">' +
      '<button type="button" class="task-card-title" data-open-task="' + t.id + '">' + esc(t.title) + "</button>" +
      '<div class="task-card-foot">' +
      '<span class="task-due' + (t.status !== "done" && isOverdue(t.dueDate) ? " overdue" : "") + '">' + (t.dueDate ? fmtDateShort(t.dueDate) : "") + "</span>" +
      '<span style="display:flex;gap:2px;">' +
      (t.status !== "todo" ? '<button class="icon-btn" title="Move back" data-task-move="' + t.id + '" data-dir="-1">&larr;</button>' : "") +
      (t.status !== "done" ? '<button class="icon-btn" title="Move forward" data-task-move="' + t.id + '" data-dir="1">&rarr;</button>' : "") +
      "</span></div></div>";

  /* ---- Notes (general + structured meeting notes) ---- */

  var noteComposerByProject = {};

  function getNoteComposer(projectId) {
    if (!noteComposerByProject[projectId]) {
      noteComposerByProject[projectId] = { type: "note", text: "", meetingDate: todayISO(), attendees: "" };
    }
    return noteComposerByProject[projectId];
  }

  function resetNoteComposer(projectId) {
    noteComposerByProject[projectId] = { type: "note", text: "", meetingDate: todayISO(), attendees: "" };
  }

  function noteComposerHTML(projectId) {
    var c = getNoteComposer(projectId);
    var isMeeting = c.type === "meeting";

      ? "What was discussed, decided, or needs following up on"

    return '<div class="note-type-tabs">' +
      '<button type="button" class="angle-tab" data-set-note-type="' + projectId + '" data-note-type="note" aria-pressed="' + (!isMeeting) + '">Note</button>' +
      '<button type="button" class="angle-tab" data-set-note-type="' + projectId + '" data-note-type="meeting" aria-pressed="' + isMeeting + '">Meeting</button>' +

      '<div class="field"><label for="noteMeetingDate">Date</label><input type="date" id="noteMeetingDate" data-note-composer-date="' + projectId + '" value="' + esc(c.meetingDate) + '"></div>' +
      '<div class="field"><label for="noteAttendees">Who was there</label><input type="text" id="noteAttendees" placeholder="e.g. Jane, Tom" data-note-composer-attendees="' + projectId + '" value="' + esc(c.attendees) + '"></div>' +
      "</div>" +
      '<div class="field" style="margin-bottom:8px;"><textarea placeholder="' + esc(placeholder) + '" rows="2" data-note-composer-text="' + projectId + '">' + esc(c.text) + "</textarea></div>" +
      '<button class="btn btn-sm" data-add-note="' + projectId + '">' + (isMeeting ? "Add meeting note" : "Add note") + "</button>";
  }

  function noteItemHTML(n) {
    var isMeeting = n.type === "meeting";
    var meta = isMeeting
      ? '<div class="note-meta"><span class="pill pill-accent">Meeting</span> <span class="tabular">' + fmtDate(n.meetingDate || n.at.slice(0, 10)) + "</span>" +
        (n.attendees ? " &middot; with " + esc(n.attendees) : "") + "</div>"

    return '<div class="note-item"><span class="note-dot" aria-hidden="true"></span><div>' + meta +
      '<div class="note-text">' + esc(n.text) + '</div><div class="note-time">' + fmtDateTime(n.at) + "</div></div></div>";
  }

    ]);
    var proposalProjectOptions = '<option value="">No linked project</option>' + state.projects.map(function (proj) {
      return '<option value="' + esc(proj.id) + '"' + (pr.projectId === proj.id ? " selected" : "") + '>' + esc(proj.name) + '</option>';

    html += '<div class="field"><label for="p_projectId">Linked project (optional)</label><select id="p_projectId">' + proposalProjectOptions + '</select>' +
      '<div class="hint">Lets this proposal pick up that project\'s client — used for a subtle brand accent on the document.</div></div>';

  function field(label, type, id, value, hint) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><input type="' + type + '" id="' + id + '" value="' + esc(value || "") + '">' +
      (hint ? '<div class="hint">' + esc(hint) + "</div>" : "") + "</div>";
  }
  function textField(label, id, value, hint, rows) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><textarea id="' + id + '" rows="' + (rows || 3) + '">' + esc(value || "") + "</textarea>" +
      (hint ? '<div class="hint">' + esc(hint) + "</div>" : "") + "</div>";
  }
  function fieldRow(fields) { return '<div class="field-row">' + fields.join("") + "</div>"; }

  function proposalPreviewHTML(pr) {
    var deliverables = pr.deliverables.filter(function (d) { return d && d.trim(); });
    var propAccent = brandAccentFor(pr);
    var propSwatch = propAccent ? '<span class="client-swatch" style="background:' + propAccent + ';" aria-hidden="true"></span> ' : "";
    var html = '<h2>' + esc(pr.projectName || "Project proposal") + "</h2>" +
      '<div class="p-meta">Prepared for ' + propSwatch + esc(pr.clientName || "—") + " &middot; " + fmtDate(todayISO()) + "</div>";
    if (pr.overview) html += "<h3>Overview</h3><p>" + esc(pr.overview) + "</p>";
    if (deliverables.length) {

  function proposalMarkdown(pr) {
    var deliverables = pr.deliverables.filter(function (d) { return d && d.trim(); });
    var lines = [];
    lines.push("# " + (pr.projectName || "Project proposal"));
    lines.push("Prepared for " + (pr.clientName || "—") + " · " + fmtDate(todayISO()));
    lines.push("");
    if (pr.overview) { lines.push("## Overview", pr.overview, ""); }
    if (deliverables.length) {
      lines.push("## What's included");
      deliverables.forEach(function (d) { lines.push("- " + d); });
      lines.push("");

  /* ====================== VIEW: MARKETING ====================== */

  var ANGLES = [
    { key: "process", label: "Process" },
    { key: "lesson", label: "Lesson" },
    { key: "tip", label: "Tip" },
    { key: "milestone", label: "Milestone" }
  ];

  function draftText(angle, task, project, detail) {
    var t = task.title.replace(/^./, function (c) { return c.toLowerCase(); });
    var proj = project ? project.name : "a client project";
    var d = detail && detail.trim() ? detail.trim() : "";
    var sentenceD = d ? (d.charAt(0).toUpperCase() + d.slice(1) + (/[.!?]$/.test(d) ? "" : ".")) : "";

    var banks = {
      process: [
        "This week's work on " + proj + ": " + t + ". " + sentenceD + "\nMost of what makes a website good happens where nobody is looking.",
        "Behind the scenes on " + proj + " right now: " + t + ". " + sentenceD + "\nSlow, unglamorous work. It's also the work that holds up.",
        "Logging progress on " + proj + ". Today's task: " + t + ". " + sentenceD + "\nA site is built one decision at a time, not one big push."
      ],
      lesson: [
        "Working through " + t + " on " + proj + " this week. " + sentenceD + "\nWorth remembering: the fix is rarely where you first look.",
        t.charAt(0).toUpperCase() + t.slice(1) + " on " + proj + " taught me something worth sharing. " + sentenceD,
        "A small lesson from " + proj + ": " + t + ". " + sentenceD + "\nSmall lessons add up faster than big ones."
      ],
      tip: [
        "If you're running your own site: " + t + " matters more than it looks. " + sentenceD + "\nWorth checking on yours.",
        "A quick one for founders managing their own website. " + t + ". " + sentenceD,
        "Something I'd tell any small business with a website: don't skip " + t + ". " + sentenceD
      ],
      milestone: [
        (task.status === "done" ? "Done: " : "In progress: ") + t + " on " + proj + ". " + sentenceD + "\nOne more step towards launch.",
        proj + " update. " + t.charAt(0).toUpperCase() + t.slice(1) + (task.status === "done" ? ", now complete." : ", underway.") + " " + sentenceD,
        "Progress note on " + proj + ": " + t + ". " + sentenceD + "\nSharing the build, not just the finish line."
      ]
    };
    var options = banks[angle] || banks.process;
    var idx = Math.floor(Math.random() * options.length);
    return options[idx].replace(/\n\s*\n/g, "\n").trim();
  }

  function viewMarketing() {
    var html = pageHead("Marketing", "Post ideas drawn from what you're actually doing — edit before you post anything.");

    var candidateTasks = state.tasks
      .filter(function (t) { return t.status === "doing" || t.status === "done"; })
      .sort(function (a, b) { return (b.completedAt || b.createdAt || "").localeCompare(a.completedAt || a.createdAt || ""); })
      .slice(0, 12);

    html += '<div class="tab-strip" role="tablist"><button role="tab" aria-selected="true" data-mtab="ideas">Ideas from your tasks</button><button role="tab" aria-selected="false" data-mtab="saved">Saved (' + state.marketingDrafts.length + ')</button></div>';

    html += '<div id="mtabIdeas">';
    if (!candidateTasks.length) {
      html += emptyState("Nothing to draw from yet", "Move a task to Doing or Done in any project and it'll show up here as post material.", '<button class="btn" data-nav="#/projects">Go to projects</button>');
    } else {
      html += candidateTasks.map(function (t) { return suggestionCardHTML(t); }).join("");
    }
    html += "</div>";

    html += '<div id="mtabSaved" style="display:none;">';
    if (!state.marketingDrafts.length) {
      html += emptyState("No saved drafts yet", "Save a draft from the ideas tab and it'll sit here until you're ready to post.", "");
    } else {
      html += state.marketingDrafts.slice().reverse().map(function (d) {
        return '<div class="card suggestion-card">' +
          '<div class="suggestion-context"><span class="pill pill-neutral">' + esc(ANGLES.find(function(a){return a.key===d.angle}) ? ANGLES.find(function(a){return a.key===d.angle}).label : d.angle) + '</span> saved ' + fmtDateShort(d.savedAt.slice(0,10)) + "</div>" +
          '<textarea class="draft-text" data-saved-text="' + d.id + '">' + esc(d.text) + "</textarea>" +

          "</div>";
      }).join("");
    }
    html += "</div>";

    return html;
  }

  function suggestionCardHTML(t) {
    var project = projectById(t.projectId);

        return '<button class="angle-tab" aria-pressed="' + (a.key === angle) + '" data-set-angle="' + t.id + '" data-angle="' + a.key + '">' + a.label + "</button>";

      "</div>";
  }

  function openDialog(title, bodyHTML, onMount) {
    var existing = document.getElementById("appDialog");
    if (existing) existing.remove();
    var dlg = document.createElement("dialog");
    dlg.id = "appDialog";
    dlg.innerHTML = '<div class="dialog-inner"><h2 class="dialog-title">' + esc(title) + '</h2><div id="dialogBody">' + bodyHTML + "</div></div>";
    document.body.appendChild(dlg);
    dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener("close", function () { dlg.remove(); });
    dlg.showModal();
    if (onMount) onMount(dlg);
    return dlg;
  }

  /**
   * A dialog-based stand-in for window.confirm(), styled to match the rest
   * of the app rather than a jarring native browser popup. Every "are you
   * sure" in this app goes through this.
   */
  function confirmAction(message, opts) {
    opts = opts || {};
    var body = '<p class="hint" style="font-size:13.5px;margin-bottom:18px;">' + esc(message) + "</p>" +
      '<div class="dialog-actions"><button type="button" class="btn" data-close-dialog="1">' + esc(opts.cancelLabel || "Cancel") + "</button>" +
      '<button type="button" class="btn ' + (opts.danger ? "btn-danger" : "btn-primary") + '" id="confirmActionBtn">' + esc(opts.confirmLabel || "Confirm") + "</button></div>";
    var dlg = openDialog(opts.title || "Are you sure?", body);
    var confirmed = false;
    dlg.querySelector("#confirmActionBtn").addEventListener("click", function () {
      confirmed = true;
      dlg.close();
      if (opts.onConfirm) opts.onConfirm();
    });
    if (opts.onCancel) {
      dlg.addEventListener("close", function () {
        if (!confirmed) opts.onCancel();
      });
    }
  }

  function backupFileName() {
    return "fieldnotes-backup-" + todayISO() + ".json";
  }

  function openBackupModal() {
    var lastLine = state.lastBackupAt
      ? "Last exported " + fmtDateTime(state.lastBackupAt) + "."
      : "You haven't exported a backup yet.";
    var body = '<p class="hint" style="margin-bottom:14px;">Your data lives inside this page. Exporting gives you your own copy — worth doing now and then, and especially before a change to the tool itself.</p>' +
      '<div class="field"><label>Export</label>' +
      '<button type="button" class="btn" id="exportBackupBtn">Download backup (.json)</button>' +
      '<div class="hint" id="lastBackupLine">' + esc(lastLine) + "</div></div>" +
      '<div class="field" style="margin-top:18px;"><label for="importFileInput">Restore from a backup file</label>' +
      '<input type="file" id="importFileInput" accept="application/json,.json">' +
      '<div class="hint">This replaces everything currently in Darren Sims Projects with what\'s in the file. There\'s no undo — export a fresh backup first if you\'re not sure.</div></div>' +
      '<div class="dialog-actions"><button type="button" class="btn" data-close-dialog="1">Close</button></div>';
    var dlg = openDialog("Backup data", body);

    dlg.querySelector("#exportBackupBtn").addEventListener("click", function () {
      var payload = JSON.stringify(state, null, 2);
      downloadFile(backupFileName(), payload, "application/json");
      state.lastBackupAt = new Date().toISOString();
      scheduleSave();
      var line = document.getElementById("lastBackupLine");
      if (line) line.textContent = "Last exported " + fmtDateTime(state.lastBackupAt) + ".";
      showToast("Backup downloaded");
    });

    dlg.querySelector("#importFileInput").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try { parsed = JSON.parse(reader.result); }
        catch (err) { showToast("That file isn't valid JSON"); return; }
        if (!parsed || !Array.isArray(parsed.clients) || !Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks)) {
          showToast("That doesn't look like a Darren Sims Projects backup file");
          return;
        }
        var counts = "(" + parsed.clients.length + " clients, " + parsed.projects.length + " projects, " + parsed.tasks.length + " tasks)";
        var fileInput = e.target;
        confirmAction("Replace everything currently in Darren Sims Projects with this backup " + counts + "? This can't be undone.", {
          title: "Restore backup",
          confirmLabel: "Replace everything",
          danger: true,
          onConfirm: function () {
            mutate(function () { state = Object.assign(defaultState(), parsed); });
            showToast("Backup restored");
          },
          onCancel: function () { fileInput.value = ""; }
        });
      };
      reader.onerror = function () { showToast("Couldn't read that file"); };
      reader.readAsText(file);
    });
  }

  function clientFormHTML(c) {
    c = c || { name: "", company: "", notes: "", websiteUrl: "", brandColor: "" };

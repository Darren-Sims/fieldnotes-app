      '<div class="field"><label for="c_company">Company</label><input type="text" id="c_company" value="' + esc(c.company || "") + '"></div>' +
      '<div class="field"><label for="c_website">Website</label><input type="url" id="c_website" placeholder="https://clientsite.com" value="' + esc(c.websiteUrl || "") + '"></div>' +
      '<div class="field"><label for="c_brandColor">Brand colour</label>' +
      '<div class="color-field-row">' +
      '<input type="color" id="c_colorPicker" value="' + swatchColor + '" aria-label="Pick brand colour">' +
      '<input type="text" id="c_brandColor" placeholder="#3d63d1" value="' + esc(c.brandColor || "") + '" maxlength="7">' +
      "</div>" +
      '<div class="hint">Used as a subtle accent on this client’s projects. Paste a hex code, or ask Claude in chat to look one up from their site — published tools can’t fetch other websites themselves.</div>' +
      "</div>" +
      '<div class="field"><label for="c_notes">Notes</label><textarea id="c_notes" rows="2">' + esc(c.notes || "") + "</textarea></div>" +
      '<div class="dialog-actions"><button type="button" class="btn" data-close-dialog="1">Cancel</button><button type="button" class="btn btn-primary" id="saveClientBtn">Save</button></div>';
  }

  function openClientModal(existing) {
    var dlg = openDialog(existing ? "Edit client" : "Add client", clientFormHTML(existing));
    var picker = document.getElementById("c_colorPicker");
    var hexInput = document.getElementById("c_brandColor");
    picker.addEventListener("input", function () { hexInput.value = picker.value; });
    hexInput.addEventListener("input", function () { if (isValidHex(hexInput.value)) picker.value = normalizeHex(hexInput.value); });
    dlg.querySelector("#saveClientBtn").addEventListener("click", function () {
      var name = document.getElementById("c_name").value.trim();
      if (!name) { document.getElementById("c_name").focus(); return; }
      var rawColor = hexInput.value.trim();
      var payload = {
        name: name,
        company: document.getElementById("c_company").value.trim(),
        websiteUrl: document.getElementById("c_website").value.trim(),
        brandColor: isValidHex(rawColor) ? normalizeHex(rawColor) : "",
        notes: document.getElementById("c_notes").value.trim()
      };
      var newClient = null;
      mutate(function () {
        if (existing) { Object.assign(existing, payload); }
        else {
          newClient = Object.assign({ id: uid("cl") }, payload);
          state.clients.push(newClient);
        }
      });
      if (existing) {
        dlg.close();
        showToast("Client updated");
        return;
      }
      showToast("Client added");
      showClientAddedStep(dlg, newClient);
    });
  }

  function showClientAddedStep(dlg, client) {
    var title = dlg.querySelector(".dialog-title");
    if (title) title.textContent = "Client added";
    var body = dlg.querySelector("#dialogBody");
    if (!body) return;
    body.innerHTML = '<p class="hint" style="margin-bottom:16px;font-size:13.5px;">' + esc(client.name) + " is in. Want to start a project for them now? Not required — you can always add one later." + "</p>" +
      '<div class="dialog-actions"><button type="button" class="btn" data-close-dialog="1">Done</button>' +
      '<button type="button" class="btn btn-primary" id="startProjectFromClientBtn">Start a project</button></div>';
    dlg.querySelector("#startProjectFromClientBtn").addEventListener("click", function () {
      dlg.close();
      openProjectModal(null, { clientId: client.id });
    });
  }

  function projectFormHTML(p) {
    p = p || { name: "", clientId: "", status: "working_it_out", dueDate: "", budget: "", description: "" };
    var clientOptions = '<option value="">No client</option>' + state.clients.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === p.clientId ? " selected" : "") + ">" + esc(c.name) + "</option>";
    }).join("");
    var statusOptions = Object.keys(STATUS_META).map(function (k) {
      return '<option value="' + k + '"' + (k === p.status ? " selected" : "") + ">" + STATUS_META[k].label + "</option>";
    }).join("");
    return '<div class="field"><label for="p_name">Project name</label><input type="text" id="p_name" value="' + esc(p.name) + '"></div>' +
      '<div class="field-row"><div class="field"><label for="p_client">Client</label><select id="p_client">' + clientOptions + "</select></div>" +
      '<div class="field"><label for="p_status">Status</label><select id="p_status">' + statusOptions + "</select></div></div>" +
      '<div class="field-row"><div class="field"><label for="p_due">Due date</label><input type="date" id="p_due" value="' + esc(p.dueDate || "") + '"></div>' +
      '<div class="field"><label for="p_budget">Budget (GBP)</label><input type="number" id="p_budget" value="' + esc(p.budget || "") + '"></div></div>' +
      '<div class="field"><label for="p_desc">Description</label><textarea id="p_desc" rows="2">' + esc(p.description || "") + "</textarea></div>" +
      '<div class="dialog-actions"><button type="button" class="btn" data-close-dialog="1">Cancel</button><button type="button" class="btn btn-primary" id="saveProjectBtn">Save</button></div>';
  }

  function openProjectModal(existing, prefill) {
    var seed = existing || Object.assign({ name: "", clientId: "", status: "working_it_out", dueDate: "", budget: "", description: "" }, prefill || {});
    var dlg = openDialog(existing ? "Edit project" : "Add project", projectFormHTML(seed));
    dlg.querySelector("#saveProjectBtn").addEventListener("click", function () {
      var name = document.getElementById("p_name").value.trim();
      if (!name) { document.getElementById("p_name").focus(); return; }
      var payload = {
        name: name,
        clientId: document.getElementById("p_client").value,
        status: document.getElementById("p_status").value,
        dueDate: document.getElementById("p_due").value,
        budget: document.getElementById("p_budget").value,
        description: document.getElementById("p_desc").value.trim()
      };
      var createdId = null;
      mutate(function () {
        if (existing) { Object.assign(existing, payload); }
        else {
          var np = Object.assign({ id: uid("proj"), notes: [], attachments: [], createdAt: new Date().toISOString() }, payload);
          state.projects.push(np);
          createdId = np.id;
        }
      });
      dlg.close();
      if (createdId) navigate("#/projects/" + createdId);
      showToast(existing ? "Project updated" : "Project added");
    });
  }

  /* ====================== GLOBAL EVENT DELEGATION ====================== */

  document.addEventListener("click", function (e) {
    var el;

    if ((el = e.target.closest("[data-nav]"))) { navigate(el.getAttribute("data-nav")); return; }

    if ((el = e.target.closest("[data-logout]"))) {
      fetch("/api/logout", { method: "POST" }).then(function () { window.location.href = "/login"; }).catch(function () { window.location.href = "/login"; });
      return;
    }

    if ((el = e.target.closest("[data-open-modal]"))) {
      var kind = el.getAttribute("data-open-modal");
      if (kind === "client") openClientModal(null);
      if (kind === "project") openProjectModal(null);
      if (kind === "backup") openBackupModal();
      return;
    }
    if ((el = e.target.closest("[data-close-dialog]"))) { document.getElementById("appDialog").close(); return; }

    if ((el = e.target.closest("[data-edit-client]"))) { openClientModal(clientById(el.getAttribute("data-edit-client"))); return; }
    if ((el = e.target.closest("[data-delete-client]"))) {
      var cid = el.getAttribute("data-delete-client");
      var used = state.projects.some(function (p) { return p.clientId === cid; });
      var doDeleteClient = function () {
        mutate(function () { state.clients = state.clients.filter(function (c) { return c.id !== cid; }); });
        showToast("Client deleted");
      };
      if (used) {
        confirmAction("This client has projects linked to them. Delete anyway? The projects will keep showing as \"No client set\".", {
          title: "Delete client",
          confirmLabel: "Delete anyway",
          danger: true,
          onConfirm: doDeleteClient
        });
      } else {
        doDeleteClient();
      }
      return;
    }

    if ((el = e.target.closest("[data-edit-project]"))) { openProjectModal(projectById(el.getAttribute("data-edit-project"))); return; }
    if ((el = e.target.closest("[data-delete-project]"))) {
      var pid = el.getAttribute("data-delete-project");
      confirmAction("Delete this project and all its tasks? This can't be undone.", {
        title: "Delete project",
        confirmLabel: "Delete project",
        danger: true,
        onConfirm: function () {
          mutate(function () {
            state.projects = state.projects.filter(function (p) { return p.id !== pid; });
            state.tasks = state.tasks.filter(function (t) { return t.projectId !== pid; });
          });
          navigate("#/projects");
          showToast("Project deleted");
        }
      });
      return;
    }

    if ((el = e.target.closest("[data-task-move]"))) {
      var tid = el.getAttribute("data-task-move");
      var dir = Number(el.getAttribute("data-dir"));
      var task = state.tasks.find(function (t) { return t.id === tid; });
      var idx = TASK_COLS.findIndex(function (c) { return c.key === task.status; });
      var next = TASK_COLS[idx + dir];
      if (next) {
        mutate(function () {
          task.status = next.key;
          if (next.key === "done") task.completedAt = new Date().toISOString();
        });
      }
      return;
    }

    if ((el = e.target.closest("[data-open-task]"))) { openTaskModal(el.getAttribute("data-open-task")); return; }

    if ((el = e.target.closest("[data-set-note-type]"))) {
      var typeProjId = el.getAttribute("data-set-note-type");
      var composer = getNoteComposer(typeProjId);
      composer.type = el.getAttribute("data-note-type");
      render();
      return;
    }

    if ((el = e.target.closest("[data-add-note]"))) {
      var noteProjId = el.getAttribute("data-add-note");
      var c = getNoteComposer(noteProjId);
      var text = c.text.trim();
      if (!text) return;
      var entry = { id: uid("note"), type: c.type, text: text, at: new Date().toISOString() };
      if (c.type === "meeting") {
        entry.meetingDate = c.meetingDate || todayISO();
        entry.attendees = c.attendees.trim();
      }
      resetNoteComposer(noteProjId);
      mutate(function () {
        var proj = projectById(noteProjId);
        proj.notes = proj.notes || [];
        proj.notes.push(entry);
      });
      return;
    }

    if ((el = e.target.closest("[data-new-proposal]"))) {
      var np = blankProposal();
      mutate(function () { state.proposals.push(np); });
      navigate("#/proposals/" + np.id);
      return;
    }
    if ((el = e.target.closest("[data-delete-proposal]"))) {
      var propId = el.getAttribute("data-delete-proposal");
      confirmAction("Delete this proposal?", {
        title: "Delete proposal",
        confirmLabel: "Delete proposal",
        danger: true,
        onConfirm: function () {
          mutate(function () { state.proposals = state.proposals.filter(function (p) { return p.id !== propId; }); });
          navigate("#/proposals");
          showToast("Proposal deleted");
        }
      });
      return;
    }
    if ((el = e.target.closest("[data-download-proposal]"))) {
      var dpId = el.getAttribute("data-download-proposal");
      var pr = state.proposals.find(function (x) { return x.id === dpId; });
      downloadFile((pr.projectName || "proposal").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".md", proposalMarkdown(pr), "text/markdown");
      showToast("Proposal downloaded");
      return;
    }
    if ((el = e.target.closest("[data-remove-deliverable]"))) {
      var propForm = document.getElementById("proposalForm");
      var pid2 = propForm.getAttribute("data-proposal-id");
      var pr2 = state.proposals.find(function (x) { return x.id === pid2; });
      var ri = Number(el.getAttribute("data-remove-deliverable"));
      commitProposalForm(pr2);
      pr2.deliverables.splice(ri, 1);
      if (!pr2.deliverables.length) pr2.deliverables = [""];
      mutate(function () {});
      navigate("#/proposals/" + pid2);
      return;
    }

    if ((el = e.target.closest("[data-new-contract]"))) {
      var ncn = blankContract();
      mutate(function () { state.contracts.push(ncn); });
      navigate("#/contracts/" + ncn.id);
      return;
    }
    if ((el = e.target.closest("[data-delete-contract]"))) {
      var conId = el.getAttribute("data-delete-contract");
      confirmAction("Delete this contract?", {
        title: "Delete contract",
        confirmLabel: "Delete contract",
        danger: true,
        onConfirm: function () {
          mutate(function () { state.contracts = state.contracts.filter(function (x) { return x.id !== conId; }); });
          navigate("#/contracts");
          showToast("Contract deleted");
          fetch("/api/contract-shares/" + conId, { method: "DELETE" })
            .then(function (res) {
              if (!res.ok) throw new Error("cleanup-failed");
            })
            .catch(function () {
              showToast("Contract deleted, but couldn't confirm its share link was revoked — check it manually");
            });
        }
      });
      return;
    }
    if ((el = e.target.closest("[data-download-contract]"))) {
      var dcId = el.getAttribute("data-download-contract");
      var dc = state.contracts.find(function (x) { return x.id === dcId; });
      downloadFile((dc.projectName || "contract").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".md", contractMarkdown(dc), "text/markdown");
      showToast("Contract downloaded");
      return;
    }
    if ((el = e.target.closest("[data-remove-contract-deliverable]"))) {
      var conForm = document.getElementById("contractForm");
      var cid2 = conForm.getAttribute("data-contract-id");
      var con2 = state.contracts.find(function (x) { return x.id === cid2; });
      var ri2 = Number(el.getAttribute("data-remove-contract-deliverable"));
      commitContractForm(con2);
      con2.deliverables.splice(ri2, 1);
      if (!con2.deliverables.length) con2.deliverables = [""];
      mutate(function () {});
      navigate("#/contracts/" + cid2);
      scheduleShareSync(con2);
      return;
    }
    if ((el = e.target.closest("[data-new-contract-for-project]"))) {
      var npProjId = el.getAttribute("data-new-contract-for-project");
      var npProj = projectById(npProjId);
      if (!npProj) return;
      var npClient = clientById(npProj.clientId);
      var npc = blankContract({ projectId: npProj.id, projectName: npProj.name, clientName: npClient ? npClient.name : "" });
      mutate(function () { state.contracts.push(npc); });
      navigate("#/contracts/" + npc.id);
      return;
    }
    if ((el = e.target.closest("[data-download-contract-pdf]"))) {
      var pdfId = el.getAttribute("data-download-contract-pdf");
      var pdfC = state.contracts.find(function (x) { return x.id === pdfId; });
      if (pdfC) {
        var pdfForm = document.getElementById("contractForm");
        if (pdfForm && pdfForm.getAttribute("data-contract-id") === pdfId) commitContractForm(pdfC);
        fetch("/api/contracts/pdf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(contractSharePayload(pdfC))
        })
          .then(function (res) {
            if (res.status === 401) { window.location.href = "/login"; throw new Error("unauthorized"); }
            if (!res.ok) throw new Error("pdf-failed");
            return res.blob();
          })
          .then(function (blob) {
            var filename = (pdfC.projectName || "contract").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".pdf";
            var blobUrl = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 2000);
          })
          .catch(function (err) {
            if (err && err.message === "unauthorized") return;
            showToast("Couldn't generate the PDF — try again");
          });
      }
      return;
    }
    if ((el = e.target.closest("[data-share-contract]"))) {
      var shId = el.getAttribute("data-share-contract");
      var shC = state.contracts.find(function (x) { return x.id === shId; });
      if (shC) {
        var shForm = document.getElementById("contractForm");
        if (shForm && shForm.getAttribute("data-contract-id") === shId) commitContractForm(shC);
        el.disabled = true;
        fetch("/api/contract-shares", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contractId: shC.id, data: contractSharePayload(shC) })
        })
          .then(function (res) {
            if (res.status === 401) { window.location.href = "/login"; throw new Error("unauthorized"); }
            if (!res.ok) throw new Error("share-failed");
            return res.json();
          })
          .then(function (result) {
            mutate(function () { shC.shareToken = result.token; });
            showToast("Share link created");
          })
          .catch(function (err) {
            el.disabled = false;
            if (err && err.message === "unauthorized") return;
            showToast("Couldn't create a share link — try again");
          });
      }
      return;
    }
    if ((el = e.target.closest("[data-stop-share-contract]"))) {
      var stId = el.getAttribute("data-stop-share-contract");
      var stC = state.contracts.find(function (x) { return x.id === stId; });
      if (!stC) return;
      confirmAction("Stop sharing this contract? The link will stop working.", {
        title: "Stop sharing",
        confirmLabel: "Stop sharing",
        danger: true,
        onConfirm: function () {
          fetch("/api/contract-shares/" + stId, { method: "DELETE" })
            .then(function (res) {
              if (res.status === 401) { window.location.href = "/login"; throw new Error("unauthorized"); }
              if (!res.ok) throw new Error("unshare-failed");
              mutate(function () { stC.shareToken = null; });
              showToast("Link stopped");
            })
            .catch(function (err) {
              if (err && err.message === "unauthorized") return;
              showToast("Couldn't stop sharing — try again");
            });
        }
      });
      return;
    }
    if ((el = e.target.closest("[data-copy-share-link]"))) {
      copyText(el.getAttribute("data-copy-share-link"));
      return;
    }

    if ((el = e.target.closest("[data-mtab]"))) {
      var tabKey = el.getAttribute("data-mtab");
      document.querySelectorAll("[data-mtab]").forEach(function (b) { b.setAttribute("aria-selected", b === el); });
      document.getElementById("mtabIdeas").style.display = tabKey === "ideas" ? "" : "none";
      document.getElementById("mtabSaved").style.display = tabKey === "saved" ? "" : "none";
      return;
    }
    if ((el = e.target.closest("[data-set-angle]"))) {
      var atid = el.getAttribute("data-set-angle");
      var t = state.tasks.find(function (x) { return x.id === atid; });
      t._angle = el.getAttribute("data-angle");
      t._draft = null;
      render();
      return;
    }
    if ((el = e.target.closest("[data-regenerate]"))) {
      var rtid = el.getAttribute("data-regenerate");
      var rt = state.tasks.find(function (x) { return x.id === rtid; });
      var wrap = el.closest("[data-task-suggestion]");
      var liveDetail = wrap ? wrap.querySelector("[data-detail-input]") : null;
      if (liveDetail) rt._detail = liveDetail.value;
      rt._draft = null;
      render();
      return;
    }
    if ((el = e.target.closest("[data-toggle-detail]"))) {
      var dtid = el.getAttribute("data-toggle-detail");
      var dt = state.tasks.find(function (x) { return x.id === dtid; });
      dt._showDetail = !dt._showDetail;
      render();
      return;
    }
    if ((el = e.target.closest("[data-copy-draft]"))) {
      var cpid = el.getAttribute("data-copy-draft");
      var area = document.querySelector('[data-draft-text="' + cpid + '"]');
      copyText(area.value);
      return;
    }
    if ((el = e.target.closest("[data-save-draft]"))) {
      var svid = el.getAttribute("data-save-draft");
      var svt = state.tasks.find(function (x) { return x.id === svid; });
      var svArea = document.querySelector('[data-draft-text="' + svid + '"]');
      mutate(function () {
        state.marketingDrafts.push({ id: uid("md"), taskId: svid, angle: svt._angle || "process", text: svArea.value, savedAt: new Date().toISOString() });
      });
      showToast("Draft saved");
      return;
    }
    if ((el = e.target.closest("[data-copy-saved]"))) {
      var scid = el.getAttribute("data-copy-saved");
      var sArea = document.querySelector('[data-saved-text="' + scid + '"]');
      copyText(sArea.value);
      return;
    }
    if ((el = e.target.closest("[data-remove-saved]"))) {
      var rmid = el.getAttribute("data-remove-saved");
      mutate(function () { state.marketingDrafts = state.marketingDrafts.filter(function (d) { return d.id !== rmid; }); });
      return;
    }

    if ((el = e.target.closest("[data-set-win-idea]"))) {
      winWorkState.activeIdea = el.getAttribute("data-set-win-idea");
      render();
      return;
    }
    if ((el = e.target.closest("[data-regenerate-win-idea]"))) {
      var rwk = el.getAttribute("data-regenerate-win-idea");
      winWorkState.ideaText[rwk] = prospectingText(rwk);
      render();
      return;
    }
    if ((el = e.target.closest("[data-copy-win-idea]"))) {
      var cwk = el.getAttribute("data-copy-win-idea");
      var wArea = document.querySelector('[data-win-idea-text="' + cwk + '"]');
      copyText(wArea ? wArea.value : (winWorkState.ideaText[cwk] || ""));
      return;
    }
    if ((el = e.target.closest("[data-draft-checkin]"))) {
      openCheckinEmailModal(el.getAttribute("data-draft-checkin"));
      return;
    }

    if ((el = e.target.closest("[data-add-attachment]"))) {
      var addProjId = el.getAttribute("data-add-attachment");
      var urlEl = document.getElementById("attUrlInput");
      var labelEl = document.getElementById("attLabelInput");
      var rawUrl = urlEl ? urlEl.value.trim() : "";
      if (!rawUrl) { if (urlEl) urlEl.focus(); return; }
      var addProj = projectById(addProjId);
      if (!addProj) return;
      mutate(function () {
        addProj.attachments = addProj.attachments || [];
        addProj.attachments.push({
          id: uid("att"),
          label: (labelEl ? labelEl.value.trim() : "") || hostFromUrl(rawUrl) || rawUrl,
          url: rawUrl,
          addedAt: new Date().toISOString()
        });
      });
      showToast("Link added");
      return;
    }
    if ((el = e.target.closest("[data-delete-attachment]"))) {
      var delAttId = el.getAttribute("data-delete-attachment");
      var delAttProj = el.getAttribute("data-attachment-project");
      confirmAction("Remove this link?", {
        title: "Remove link",
        confirmLabel: "Remove link",
        danger: true,
        onConfirm: function () {
          var proj = projectById(delAttProj);
          if (!proj) return;
          mutate(function () { proj.attachments = (proj.attachments || []).filter(function (a) { return a.id !== delAttId; }); });
          showToast("Link removed");
        }
      });
      return;
    }
    if ((el = e.target.closest("[data-upload-attachment]"))) {
      var uploadProjId = el.getAttribute("data-upload-attachment");
      var fileEl = document.getElementById("attFileInput");
      var uploadLabelEl = document.getElementById("attLabelInput");
      var file = fileEl && fileEl.files ? fileEl.files[0] : null;
      if (!file) { if (fileEl) fileEl.focus(); return; }
      if (file.size > 10 * 1024 * 1024) {
        showToast("That file is over 10MB — pick a smaller one");
        return;
      }
      var fd = new FormData();
      fd.append("projectId", uploadProjId);
      fd.append("label", uploadLabelEl ? uploadLabelEl.value.trim() : "");
      fd.append("file", file);
      el.disabled = true;
      var origLabel = el.textContent;
      el.textContent = "Uploading…";
      fetch("/api/attachments", { method: "POST", body: fd })
        .then(function (res) {
          if (res.status === 401) { window.location.href = "/login"; throw new Error("unauthorized"); }
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (!res.ok) throw new Error((data && data.error) || "upload-failed");
            return data;
          });
        })
        .then(function (saved) {
          var list = fileAttachmentsCache[uploadProjId];
          fileAttachmentsCache[uploadProjId] = (list || []).concat([saved]);
          if (fileEl) fileEl.value = "";
          if (uploadLabelEl) uploadLabelEl.value = "";
          showToast("File uploaded");
          render();
        })
        .catch(function (err) {
          if (err && err.message === "unauthorized") return;
          showToast("Couldn't upload that file — try again");
        })
        .then(function () {
          el.disabled = false;
          el.textContent = origLabel;
        });
      return;
    }
    if ((el = e.target.closest("[data-delete-file-attachment]"))) {
      var delFileId = el.getAttribute("data-delete-file-attachment");
      confirmAction("Remove this file?", {
        title: "Remove file",
        confirmLabel: "Remove file",
        danger: true,
        onConfirm: function () {
          fetch("/api/attachments/" + delFileId, { method: "DELETE" })
            .then(function (res) {
              if (res.status === 401) { window.location.href = "/login"; throw new Error("unauthorized"); }
              if (!res.ok) throw new Error("delete-failed");
              Object.keys(fileAttachmentsCache).forEach(function (pid) {
                var list = fileAttachmentsCache[pid];
                if (list) fileAttachmentsCache[pid] = list.filter(function (a) { return a.id !== delFileId; });
              });
              showToast("File removed");
              render();
            })
            .catch(function (err) {
              if (err && err.message === "unauthorized") return;
              showToast("Couldn't remove that file — try again");
            });
        }
      });
      return;
    }
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast("Copied"); }).catch(function () { showToast("Couldn't copy — select and copy manually"); });
    } else {
      showToast("Copy isn't available here — select the text manually");
    }
  }

  function downloadFile(filename, data, mime) {
    var blob = new Blob([data], { type: mime || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  document.addEventListener("input", function (e) {
    if (e.target.matches("[data-note-composer-text]")) {
      getNoteComposer(e.target.getAttribute("data-note-composer-text")).text = e.target.value;
      return;
    }
    if (e.target.matches("[data-note-composer-date]")) {
      getNoteComposer(e.target.getAttribute("data-note-composer-date")).meetingDate = e.target.value;
      return;
    }
    if (e.target.matches("[data-note-composer-attendees]")) {
      getNoteComposer(e.target.getAttribute("data-note-composer-attendees")).attendees = e.target.value;
      return;
    }
    if (e.target.matches("[data-deliverable-index]")) {
      var pForm = document.getElementById("proposalForm");
      var pidD = pForm.getAttribute("data-proposal-id");
      var prD = state.proposals.find(function (x) { return x.id === pidD; });
      var di = Number(e.target.getAttribute("data-deliverable-index"));
      prD.deliverables[di] = e.target.value;
      var preview = document.getElementById("proposalPreview");
      if (preview) preview.innerHTML = proposalPreviewHTML(prD);
      scheduleSave();
      return;
    }
    if (e.target.matches("#proposalForm input, #proposalForm textarea, #proposalForm select")) {
      var f = document.getElementById("proposalForm");
      var pid3 = f.getAttribute("data-proposal-id");
      var pr3 = state.proposals.find(function (x) { return x.id === pid3; });
      commitProposalForm(pr3);
      var preview2 = document.getElementById("proposalPreview");
      if (preview2) {
        preview2.innerHTML = proposalPreviewHTML(pr3);
        var pAccent = brandAccentFor(pr3);
        preview2.style.borderTop = pAccent ? "3px solid " + pAccent : "";
      }
      scheduleSave();
      return;
    }
    if (e.target.matches("[data-contract-deliverable-index]")) {
      var conForm2 = document.getElementById("contractForm");
      var cidD = conForm2.getAttribute("data-contract-id");
      var conD = state.contracts.find(function (x) { return x.id === cidD; });
      var ci = Number(e.target.getAttribute("data-contract-deliverable-index"));
      conD.deliverables[ci] = e.target.value;
      var cPreview = document.getElementById("contractPreview");
      if (cPreview) cPreview.innerHTML = contractPreviewHTML(conD);
      scheduleSave();
      scheduleShareSync(conD);
      return;
    }
    if (e.target.matches("#contractForm input, #contractForm textarea, #contractForm select")) {
      var cf = document.getElementById("contractForm");
      var cid3 = cf.getAttribute("data-contract-id");
      var con3 = state.contracts.find(function (x) { return x.id === cid3; });
      commitContractForm(con3);
      var cPreview2 = document.getElementById("contractPreview");
      if (cPreview2) {
        cPreview2.innerHTML = contractPreviewHTML(con3);
        var cAccent2 = brandAccentFor(con3);
        cPreview2.style.borderTop = cAccent2 ? "3px solid " + cAccent2 : "";
      }
      scheduleSave();
      scheduleShareSync(con3);
      return;
    }
    if (e.target.matches("[data-draft-text]")) {
      var el2 = e.target;
      var foot = el2.closest(".suggestion-card").querySelector(".char-count");
      if (foot) foot.textContent = el2.value.length + " characters";
      return;
    }
    if (e.target.matches("[data-detail-input]")) {
      var idAttr = e.target.getAttribute("data-detail-input");
      var t3 = state.tasks.find(function (x) { return x.id === idAttr; });
      if (t3) t3._detail = e.target.value;
      return;
    }
    if (e.target.matches("[data-win-idea-text]")) {
      var wEl = e.target;
      var wFoot = wEl.closest(".card").querySelector(".char-count");
      if (wFoot) wFoot.textContent = wEl.value.length + " characters";
      return;
    }
  });

  function commitProposalForm(pr) {
    pr.clientName = val("p_clientName");
    pr.projectName = val("p_projectName");
    pr.projectId = val("p_projectId") || null;
    pr.overview = val("p_overview");
    pr.timeline = val("p_timeline");
    pr.price = val("p_price");
    pr.paymentTerms = val("p_paymentTerms");
    pr.terms = val("p_terms");
    pr.updatedAt = new Date().toISOString();
    function val(id) { var e = document.getElementById(id); return e ? e.value : ""; }
  }

  function commitContractForm(c) {
    c.clientName = val("c_clientName");
    c.clientCompany = val("c_clientCompany");
    c.clientAddress = val("c_clientAddress");
    c.yourName = val("c_yourName");
    c.yourEmail = val("c_yourEmail");
    c.yourAddress = val("c_yourAddress");
    c.projectId = val("c_projectId") || null;
    c.projectName = val("c_projectName");
    c.contractDate = val("c_contractDate");
    c.overview = val("c_overview");
    c.exclusions = val("c_exclusions");
    c.startDate = val("c_startDate");
    c.timeline = val("c_timeline");
    c.price = val("c_price");
    c.paymentTerms = val("c_paymentTerms");
    c.revisions = val("c_revisions");
    c.ownership = val("c_ownership");
    c.cancellation = val("c_cancellation");
    c.liability = val("c_liability");
    c.confidentiality = val("c_confidentiality");
    c.governingLaw = val("c_governingLaw");
    c.updatedAt = new Date().toISOString();
    function val(id) { var e = document.getElementById(id); return e ? e.value : ""; }
  }

  /* The bits of a contract that are shown on a public share link / PDF —
   * everything except internal bookkeeping (id, projectId, shareToken,
   * timestamps), which the client viewing the link has no use for. */
  function contractSharePayload(c) {
    return {
      clientName: c.clientName, clientCompany: c.clientCompany, clientAddress: c.clientAddress,
      projectName: c.projectName, yourName: c.yourName, yourAddress: c.yourAddress, yourEmail: c.yourEmail,
      contractDate: c.contractDate, overview: c.overview, deliverables: c.deliverables, exclusions: c.exclusions,
      startDate: c.startDate, timeline: c.timeline, price: c.price, paymentTerms: c.paymentTerms,
      revisions: c.revisions, ownership: c.ownership, cancellation: c.cancellation, liability: c.liability,
      confidentiality: c.confidentiality, governingLaw: c.governingLaw,
      clientAccent: brandAccentFor(c) || null
    };
  }

  var shareSyncTimer = null;
  function scheduleShareSync(c) {
    if (!c || !c.shareToken) return;
    if (shareSyncTimer) clearTimeout(shareSyncTimer);
    shareSyncTimer = setTimeout(function () {
      fetch("/api/contract-shares", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contractId: c.id, data: contractSharePayload(c) })
      }).catch(function () { /* best-effort — the next edit will retry */ });
    }, 1500);
  }

  document.addEventListener("click", function (e) {
    if (e.target && e.target.id === "addDeliverable") {
      var f = document.getElementById("proposalForm");
      var pid4 = f.getAttribute("data-proposal-id");
      var pr4 = state.proposals.find(function (x) { return x.id === pid4; });
      commitProposalForm(pr4);
      pr4.deliverables.push("");
      mutate(function () {});
      navigate("#/proposals/" + pid4);
      // restore scroll focus roughly by re-render only (acceptable for a short form)
    }
    if (e.target && e.target.id === "addContractDeliverable") {
      var cf2 = document.getElementById("contractForm");
      var cid4 = cf2.getAttribute("data-contract-id");
      var con4 = state.contracts.find(function (x) { return x.id === cid4; });
      commitContractForm(con4);
      con4.deliverables.push("");
      mutate(function () {});
      navigate("#/contracts/" + cid4);
      scheduleShareSync(con4);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches("[data-new-task]")) {
      e.preventDefault();
      var projId = e.target.getAttribute("data-new-task");
      var title = e.target.value.trim();
      if (!title) return;
      mutate(function () {
        state.tasks.push({ id: uid("task"), projectId: projId, title: title, status: "todo", dueDate: "", createdAt: new Date().toISOString() });
      });
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[data-nav][role="button"]')) {
      e.preventDefault();
      e.target.click();
    }
  });

  /* ====================== TASK MODAL ====================== */

  function openTaskModal(taskId) {
    var t = state.tasks.find(function (x) { return x.id === taskId; });
    if (!t) return;
    var body = '<div class="field"><label for="t_title">Title</label><input type="text" id="t_title" value="' + esc(t.title) + '"></div>' +
      '<div class="field-row"><div class="field"><label for="t_status">Status</label><select id="t_status">' +
      TASK_COLS.map(function (c) { return '<option value="' + c.key + '"' + (c.key === t.status ? " selected" : "") + ">" + c.label + "</option>"; }).join("") +
      '</select></div><div class="field"><label for="t_due">Due date</label><input type="date" id="t_due" value="' + esc(t.dueDate || "") + '"></div></div>' +
      '<div class="field"><label for="t_note">Note</label><textarea id="t_note" rows="2">' + esc(t.note || "") + "</textarea></div>" +
      '<div class="dialog-actions"><button type="button" class="btn btn-danger-quiet" id="deleteTaskBtn">Delete task</button><span style="flex:1"></span><button type="button" class="btn" data-close-dialog="1">Cancel</button><button type="button" class="btn btn-primary" id="saveTaskBtn">Save</button></div>';
    var dlg = openDialog("Edit task", body);
    dlg.querySelector("#saveTaskBtn").addEventListener("click", function () {
      var title = document.getElementById("t_title").value.trim();
      if (!title) { document.getElementById("t_title").focus(); return; }
      mutate(function () {
        t.title = title;
        var wasNotDone = t.status !== "done";
        t.status = document.getElementById("t_status").value;
        t.dueDate = document.getElementById("t_due").value;
        t.note = document.getElementById("t_note").value.trim();
        if (t.status === "done" && wasNotDone) t.completedAt = new Date().toISOString();
      });
      dlg.close();
    });
    dlg.querySelector("#deleteTaskBtn").addEventListener("click", function () {
      confirmAction("Delete this task?", {
        title: "Delete task",
        confirmLabel: "Delete task",
        danger: true,
        onConfirm: function () {
          mutate(function () { state.tasks = state.tasks.filter(function (x) { return x.id !== taskId; }); });
          showToast("Task deleted");
        }
      });
    });
  }

  /* ====================== BOOT ====================== */

  function boot() {
    render();
    loadData().then(function () {
      setSaveState(loadFailed ? "load_error" : "saved");
      render();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract — Darren Sims Projects</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/logo.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f5f5;
    --surface: #ffffff;
    --surface-sunken: #ebebeb;
    --surface-raised-shadow: 0 1px 2px rgba(10,10,10,0.06), 0 1px 1px rgba(10,10,10,0.04);
    --border: #d4d4d4;
    --border-interactive: #737373;
    --text-primary: #111111;
    --text-secondary: #404040;
    --text-on-accent: #ffffff;

    --accent: #1e2a5e;
    --accent-strong: #141b45;
    --accent-ring: #aebdec;
    --accent-tint: #e8edfa;

    --danger-text: #b91c1c;
    --danger-bg: #fdeaea;

    --font-display: "Archivo", "Arial Black", sans-serif;
    --font-body: "Public Sans", -apple-system, "Segoe UI", sans-serif;

    --radius-sm: 5px;
    --radius-md: 8px;
    --radius-lg: 14px;
    --radius-pill: 999px;

    --hero-wash: radial-gradient(120% 160% at 8% -10%, #eef1fb 0%, #f6f4ee 38%, #eef7f5 68%, #f7f7f5 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0a0a0a;
      --surface: #171717;
      --surface-sunken: #101010;
      --surface-raised-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 4px 14px rgba(0,0,0,0.35);
      --border: #262626;
      --border-interactive: #666666;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-on-accent: #ffffff;
      --accent: #6f8fe0;
      --accent-strong: #a9bcee;
      --accent-ring: #3a4a86;
      --accent-tint: #14203f;
      --danger-text: #f3a6a6;
      --danger-bg: #2a0f0f;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--hero-wash, var(--ground));
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: 32px 20px 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: var(--ground); }
  }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }

  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap { max-width: 680px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand-mark {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    flex: none;
  }
  .brand-mark img, .brand-mark picture { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--surface-raised-shadow);
    padding: 32px 36px;
  }
  @media (max-width: 560px) { .card { padding: 24px 20px; } }

  .doc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .doc-head h2 { font-size: 21px; margin-bottom: 4px; }
  .p-meta { color: var(--text-secondary); font-size: 12.5px; }

  .btn-pdf {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: var(--radius-pill);
    font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
    border: 1px solid var(--accent); background: var(--accent); color: var(--text-on-accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
    flex: none; white-space: nowrap;
  }
  .btn-pdf:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin: 22px 0 8px; }
  h3:first-of-type { margin-top: 0; }
  .doc p { margin-bottom: 10px; white-space: pre-wrap; font-size: 14px; }
  .doc ul { list-style: disc; padding-left: 20px; margin-bottom: 10px; font-size: 14px; }
  .doc li { margin-bottom: 4px; }

  .foot-note { margin-top: 20px; font-size: 12px; color: var(--text-secondary); text-align: center; }

  .state-card { text-align: center; padding: 48px 30px; }
  .state-card h1 { font-size: 18px; margin-bottom: 8px; }
  .state-card p { color: var(--text-secondary); font-size: 13.5px; }

  .sig-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 4px; }
  .sig-col { flex: 1; min-width: 160px; }
  .sig-role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); margin-bottom: 6px; }
  .sig-block { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-sunken); padding: 10px; min-height: 56px; display: flex; flex-direction: column; justify-content: center; }
  .sig-block.sig-empty { color: var(--text-secondary); font-size: 13px; }
  .sig-image { max-width: 100%; max-height: 60px; background: #ffffff; border-radius: 4px; padding: 4px; display: block; }
  .sig-meta { font-size: 11.5px; color: var(--text-secondary); margin-top: 4px; }

  .sign-card { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .sign-card h3:first-child { margin-top: 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
  .field input[type="text"] {
    width: 100%; padding: 9px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-interactive); background: var(--surface); color: var(--text-primary); font-size: 14px;
  }
  .sig-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab-btn {
    padding: 6px 13px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer;
  }
  .tab-btn[aria-pressed="true"] { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-strong); }
  .sig-canvas-wrap { border: 1px dashed var(--border-interactive); border-radius: var(--radius-md); background: #ffffff; margin-bottom: 8px; }
  .sig-canvas { display: block; width: 100%; height: 130px; touch-action: none; cursor: crosshair; border-radius: var(--radius-md); }
  .sig-upload-preview { max-width: 100%; max-height: 90px; margin-top: 8px; background: #ffffff; border-radius: 4px; padding: 4px; border: 1px solid var(--border); display: block; }
  .btn-outline-sm {
    padding: 6px 12px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  }
  .link-btn { background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 12.5px; padding: 0; }
  .sign-error { display: none; color: var(--danger-text); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><picture><source srcset="/logo-dark.png" media="(prefers-color-scheme: dark)"><img src="/logo.png" alt=""></picture></div>
      <div class="brand-name">Darren Sims Projects</div>
    </div>
    <div id="content">
      <div class="card state-card"><h1>Loading contract…</h1></div>
    </div>
    <p class="foot-note" id="footNote" style="display:none;">Shared privately via Darren Sims Projects. This link doesn't require an account.</p>
  </div>

  <script>
    (function () {
      "use strict";

      function esc(str) {
        return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function fmtDate(iso) {
        if (!iso) return "";
        var d = new Date(iso + "T00:00:00");
        if (isNaN(d.getTime())) return String(iso);
        return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      }
      function money(n) {
        var v = Number(n);
        if (n === "" || n == null || isNaN(v)) return "";
        return "£" + v.toLocaleString("en-GB", { maximumFractionDigits: 0 });
      }
      function todayISO() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }

      var parts = location.pathname.split("/").filter(Boolean);
      var token = parts[parts.length - 1] || "";
      var content = document.getElementById("content");
      var footNote = document.getElementById("footNote");
      var currentData = {};
      var currentSignatures = { developer: null, client: null };

      function showState(title, body) {
        content.innerHTML = '<div class="card state-card"><h1>' + esc(title) + "</h1><p>" + esc(body) + "</p></div>";
      }

      function signatureStatusHTML(sig, personName) {
        if (sig && sig.imageData) {
          return '<div class="sig-block"><img class="sig-image" src="' + esc(sig.imageData) + '" alt="Signature">' +
            '<div class="sig-meta">' + esc(sig.name || personName || "") + " &middot; signed " + fmtDate(String(sig.signedAt).slice(0, 10)) + "</div></div>";
        }
        return '<div class="sig-block sig-empty">Not yet signed</div>';
      }

      function render(data, signatures) {
        currentData = data;
        currentSignatures = signatures || { developer: null, client: null };
        var deliverables = (data.deliverables || []).filter(function (d) { return d && String(d).trim(); });
        var clientLabel = esc(data.clientName || "—") + (data.clientCompany ? " (" + esc(data.clientCompany) + ")" : "");
        var pdfUrl = "/api/public/contract-shares/" + encodeURIComponent(token) + "/pdf";
        var accent = typeof data.clientAccent === "string" && /^#[0-9a-f]{6}$/i.test(data.clientAccent) ? data.clientAccent : "";
        var swatch = accent ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + accent + ';margin-right:5px;" aria-hidden="true"></span>' : "";

        var html = '<div class="card"' + (accent ? ' style="border-top:3px solid ' + accent + ';"' : "") + '>';
        html += '<div class="doc-head"><div><h2>' + esc(data.projectName || "Project agreement") + "</h2>" +
          '<div class="p-meta">Between ' + esc(data.yourName || "—") + " and " + swatch + clientLabel + " &middot; " + fmtDate(data.contractDate || todayISO()) + "</div></div>" +
          '<a class="btn-pdf" href="' + pdfUrl + '">Download PDF</a></div>';

        html += '<div class="doc">';
        html += "<h3>Parties</h3><p>This agreement is between <strong>" + esc(data.yourName || "the Developer") + '</strong> ("the Developer")' +
          (data.yourAddress ? ", of " + esc(data.yourAddress) : "") + ", and <strong>" + esc(data.clientName || "the Client") + "</strong>" +
          (data.clientCompany ? " of " + esc(data.clientCompany) : "") + ' ("the Client")' + (data.clientAddress ? ", of " + esc(data.clientAddress) : "") + ".</p>";
        if (data.overview) html += "<h3>Scope of work</h3><p>" + esc(data.overview) + "</p>";
        if (deliverables.length) html += "<h3>Deliverables</h3><ul>" + deliverables.map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("") + "</ul>";
        if (data.exclusions) html += "<h3>Not included</h3><p>" + esc(data.exclusions) + "</p>";
        if (data.startDate || data.timeline) {
          html += "<h3>Timeline</h3><p>" + (data.startDate ? "Starting " + fmtDate(data.startDate) + ". " : "") + esc(data.timeline || "") + "</p>";
        }
        if (data.price) html += "<h3>Fees</h3><p>" + money(data.price) + (data.paymentTerms ? "\n" + esc(data.paymentTerms) : "") + "</p>";
        if (data.revisions) html += "<h3>Revisions</h3><p>" + esc(data.revisions) + "</p>";
        if (data.ownership) html += "<h3>Ownership &amp; IP</h3><p>" + esc(data.ownership) + "</p>";
        if (data.cancellation) html += "<h3>Cancellation</h3><p>" + esc(data.cancellation) + "</p>";
        if (data.liability) html += "<h3>Liability</h3><p>" + esc(data.liability) + "</p>";
        if (data.confidentiality) html += "<h3>Confidentiality</h3><p>" + esc(data.confidentiality) + "</p>";
        html += "<h3>Governing law</h3><p>This agreement is governed by the law of " + esc(data.governingLaw || "England and Wales") + ".</p>";

        html += "<h3>Agreed</h3><div class=\"sig-row\">" +
          '<div class="sig-col"><div class="sig-role">Client</div>' + signatureStatusHTML(currentSignatures.client, data.clientName) + "</div>" +
          '<div class="sig-col"><div class="sig-role">Developer</div>' + signatureStatusHTML(currentSignatures.developer, data.yourName) + "</div>" +
          "</div>";
        html += '<div id="signBlock"></div>';
        html += "</div></div>";

        content.innerHTML = html;
        footNote.style.display = "block";
        renderSignBlock();
      }

      /* ---- Signing ---- */

      function renderSignBlock() {
        var wrap = document.getElementById("signBlock");
        if (!wrap) return;
        if (currentSignatures.client) {
          wrap.innerHTML = '<p style="margin-top:10px;"><button type="button" class="link-btn" id="resignBtn">Made a mistake? Sign again</button></p>';
          document.getElementById("resignBtn").addEventListener("click", showSignForm);
        } else {
          showSignForm();
        }
      }

      function showSignForm() {
        var wrap = document.getElementById("signBlock");
        if (!wrap) return;
        wrap.innerHTML =
          '<div class="sign-card">' +
          "<h3>Sign this contract</h3>" +
          '<div class="field"><label for="signName">Full name</label><input type="text" id="signName" placeholder="Your full name" value="' + esc((currentSignatures.client && currentSignatures.client.name) || currentData.clientName || "") + '"></div>' +
          '<div class="sig-tabs">' +
          '<button type="button" class="tab-btn" data-sign-tab="draw" aria-pressed="true">Draw</button>' +
          '<button type="button" class="tab-btn" data-sign-tab="upload" aria-pressed="false">Upload</button>' +
          "</div>" +
          '<div id="signDrawPane"><div class="sig-canvas-wrap"><canvas id="signCanvas" class="sig-canvas"></canvas></div>' +
          '<button type="button" class="btn-outline-sm" id="signClearBtn">Clear</button></div>' +
          '<div id="signUploadPane" style="display:none;"><input type="file" id="signFileInput" accept="image/*">' +
          '<div id="signUploadPreviewWrap"></div></div>' +
          '<button type="button" class="btn-pdf" id="signSaveBtn" style="margin-top:12px;">Sign contract</button>' +
          '<p class="sign-error" id="signError"></p>' +
          "</div>";
        wireSignForm();
      }

      function wireSignForm() {
        var wrap = document.getElementById("signBlock");
        var canvas = wrap.querySelector("#signCanvas");
        var ctx = canvas.getContext("2d");
        var dpr = window.devicePixelRatio || 1;
        var rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#111111";

        var drawing = false, hasDrawn = false, lastX = 0, lastY = 0;
        function pointFromEvent(e) {
          var r = canvas.getBoundingClientRect();
          var p = e.touches && e.touches.length ? e.touches[0] : e;
          return { x: p.clientX - r.left, y: p.clientY - r.top };
        }
        function startDraw(e) {
          drawing = true; hasDrawn = true;
          var p = pointFromEvent(e); lastX = p.x; lastY = p.y;
          e.preventDefault();
        }
        function moveDraw(e) {
          if (!drawing) return;
          var p = pointFromEvent(e);
          ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
          lastX = p.x; lastY = p.y;
          e.preventDefault();
        }
        function endDraw() { drawing = false; }
        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", moveDraw);
        canvas.addEventListener("mouseup", endDraw);
        canvas.addEventListener("mouseleave", endDraw);
        canvas.addEventListener("touchstart", startDraw, { passive: false });
        canvas.addEventListener("touchmove", moveDraw, { passive: false });
        canvas.addEventListener("touchend", endDraw);

        wrap.querySelector("#signClearBtn").addEventListener("click", function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          hasDrawn = false;
        });

        var activeTab = "draw";
        var uploadedDataUrl = null;
        Array.prototype.forEach.call(wrap.querySelectorAll("[data-sign-tab]"), function (tabBtn) {
          tabBtn.addEventListener("click", function () {
            activeTab = tabBtn.getAttribute("data-sign-tab");
            Array.prototype.forEach.call(wrap.querySelectorAll("[data-sign-tab]"), function (b) { b.setAttribute("aria-pressed", String(b === tabBtn)); });
            wrap.querySelector("#signDrawPane").style.display = activeTab === "draw" ? "" : "none";
            wrap.querySelector("#signUploadPane").style.display = activeTab === "upload" ? "" : "none";
          });
        });

        wrap.querySelector("#signFileInput").addEventListener("change", function (e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            uploadedDataUrl = reader.result;
            wrap.querySelector("#signUploadPreviewWrap").innerHTML = '<img class="sig-upload-preview" src="' + uploadedDataUrl + '" alt="Uploaded signature preview">';
          };
          reader.readAsDataURL(file);
        });

        function showSignError(msg) {
          var errEl = wrap.querySelector("#signError");
          errEl.textContent = msg;
          errEl.style.display = "block";
        }

        wrap.querySelector("#signSaveBtn").addEventListener("click", function () {
          var name = wrap.querySelector("#signName").value.trim();
          var imageData = activeTab === "draw" ? (hasDrawn ? canvas.toDataURL("image/png") : null) : uploadedDataUrl;
          if (!name) { showSignError("Enter your full name."); return; }
          if (!imageData) {
            showSignError(activeTab === "draw" ? "Draw your signature first, or switch to Upload." : "Choose an image to upload.");
            return;
          }
          var saveBtn = wrap.querySelector("#signSaveBtn");
          saveBtn.disabled = true;
          saveBtn.textContent = "Saving…";
          fetch("/api/public/contract-shares/" + encodeURIComponent(token) + "/signature", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, imageData: imageData })
          })
            .then(function (res) {
              return res.json().catch(function () { return {}; }).then(function (d) {
                if (!res.ok) throw new Error(d.error || "Could not save your signature");
                return d;
              });
            })
            .then(function (result) {
              currentSignatures.client = { name: name, imageData: imageData, signedAt: result.signedAt };
              render(currentData, currentSignatures);
            })
            .catch(function (err) {
              saveBtn.disabled = false;
              saveBtn.textContent = "Sign contract";
              showSignError(err.message || "Could not save your signature. Try again.");
            });
        });
      }

      if (!token) {
        showState("Link not found", "This link is missing its contract reference.");
        return;
      }

      fetch("/api/public/contract-shares/" + encodeURIComponent(token), { cache: "no-store" })
        .then(function (res) {
          if (res.status === 404) { showState("This link isn't valid", "It may have been removed, or never existed."); throw new Error("handled"); }
          if (!res.ok) throw new Error("load-failed");
          return res.json();
        })
        .then(function (result) { render(result.data || {}, result.signatures); })
        .catch(function (err) {
          if (err && err.message === "handled") return;
          showState("Couldn't load this contract", "Check your connection and try refreshing the page.");
        });
    })();
  </script>
</body>
</html>
